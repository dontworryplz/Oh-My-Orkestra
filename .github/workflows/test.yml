name: Orchestra Adapter Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run agy_agent unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate JSON and shell syntax
        run: |
          python3 -c "import json; json.load(open('config/roles.json'))"
          bash -n install.sh scripts/agy-run.sh
